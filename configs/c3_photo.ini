; c3 CMB photometric samples (DESI_Y3_x_CMB BGS, LRG1-3), run with
; calculate_magnification_bias_c3.py -- see CLAUDE.md "c3 CMB samples".
; Catalogs: Gerrit's prepared PhotoSample files (loaded via DESI_Y3_x_CMB).
; z-ranges come from DESI_Y3_x_CMB's sample definitions (c3_samples_*).
[general]
galaxy_types=BGS_phot,LRG_phot
regions=all,north,south,des,south+des,NGC,SGC,des_photo-only,GAL040,act,planck

c3_samples_BGS_phot=BGS
zcol_BGS_phot=Z_PHOT_MEDIAN
; none | Z_WEIGHT*WEIGHT_IMLIN (Clgg weighting) | Z_WEIGHT*KERNEL_WEIGHT_KAPPA*WEIGHT_IMLIN (Clkg weighting)
weights_BGS_phot=none,weight_phot,weight_phot_kernel

c3_samples_LRG_phot=LRG1,LRG2,LRG3
zcol_LRG_phot=Z_PHOT_MEDIAN
weights_LRG_phot=none,weight_phot,weight_phot_kernel

version=v2
apply_cut_secondary_properties=True
apply_individual_cuts=True
dkappa = 0.002
dkappa_max = 0.03

fiber_mag_lensing = Tabulated

; BGS_phot/LRG_phot secondary cuts are hardcoded-skipped in cuts.py --
; no [secondary_properties] section needed.

[individual_cuts]
validate_individual_cuts=False

[output]
output_path=/global/cfs/cdirs/desi/users/schiarenza/magnification_bias_DESI/measurements/
output_subdir=c3cmb
