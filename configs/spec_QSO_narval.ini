[general]
galaxy_types=QSO
regions=all,north,south,des,south+des

zbins_QSO=0.8,2.1,3.5
weights_QSO=weight_FKP
use_zcmb=True

; See configs/spec_LRG_narval.ini for the full explanation of this local data
; layout and what's still missing (QSO_full_HPmapcut.dat.fits + the DR9
; per-healpix target files -- see nersc_data/dr9_dark_healpix8_pixels_needed.txt).
full_lss_path=nersc_data/DA2/
lensing_path=nersc_data/DA2/v2/nonKP/
version=v2
apply_cut_secondary_properties=True
apply_individual_cuts=True
do_full_alpha_stepwise_calculation=True
dkappa = 0.002
dkappa_max = 0.03

fiber_mag_lensing = Tabulated
#alternatives:
#deVaucouleurs_prifle
#Exponential_profile
#Tabulated
#no_correction

; QSO has no secondary cuts -- no [secondary_properties] entry needed

[individual_cuts]
validate_individual_cuts=False

[output]
output_path=measurements/
output_filename=DESI_magnification_bias_QSO.h5
