; c3 CMB spectroscopic samples (DESI_Y3_x_CMB BGS, LRG1-3, ELG, QSO/QSO1/QSO2),
; run with calculate_magnification_bias_c3.py -- see CLAUDE.md "c3 CMB samples".
; Catalogs: the exact per-cap clustering files DESI_Y3_x_CMB reads (Gerrit's
; scratch copies of v2/nonKP, plain Z; ELG from ELG_NNweights, the alternative
; completeness weights). Weights: WEIGHT*WEIGHT_FKP (default WEIGHT, i.e.
; COMP*SYS*ZFAIL), plus unweighted as a reference.
; Prerequisite (once): python fit_secondary_quantities.py configs/c3_secondary_fit_BGS.ini
[general]
galaxy_types=BGS_BRIGHT-21.35,LRG,ELG_LOPnotqso,QSO
regions=all,north,south,des,south+des,NGC,SGC,act,planck,GAL040
catalog_source=desi_y3_x_cmb

c3_samples_BGS_BRIGHT-21.35=BGS
weights_BGS_BRIGHT-21.35=weight_FKP,none
magnitude_def_BGS_BRIGHT-21.35=DA2
absmag_cuts_BGS_BRIGHT-21.35=21.35

c3_samples_LRG=LRG1,LRG2,LRG3
weights_LRG=weight_FKP,none

c3_samples_ELG_LOPnotqso=ELG
weights_ELG_LOPnotqso=weight_FKP,none

c3_samples_QSO=QSO,QSO1,QSO2
weights_QSO=weight_FKP,none

; only used for the full_HPmapcut join (photometric-cut columns)
full_lss_path=/global/cfs/projectdirs/desi/survey/catalogs/DA2/LSS/loa-v1/LSScats/
version=v2
apply_cut_secondary_properties=True
apply_individual_cuts=True
dkappa = 0.002
dkappa_max = 0.03

fiber_mag_lensing = Tabulated

[secondary_properties]
Xval_BGS_BRIGHT-21.35=FIBERFLUX_R
relevant_secondary_properties_BGS_BRIGHT-21.35=DELTACHI2
Xval_LRG=FIBERFLUX_Z
relevant_secondary_properties_LRG=DELTACHI2
Xval_ELG_LOPnotqso=FIBERFLUX_G
relevant_secondary_properties_ELG_LOPnotqso=o2c

[individual_cuts]
validate_individual_cuts=False

[output]
output_path=/global/cfs/cdirs/desi/users/schiarenza/magnification_bias_DESI/measurements/
output_subdir=c3cmb
