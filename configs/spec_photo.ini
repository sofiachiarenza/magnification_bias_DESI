[general]
galaxy_types=BGS_phot,LRG_phot
regions=des_photo-only

zbins_BGS_phot=0.15,0.4
zcol_BGS_phot=Z_PHOT_MEDIAN
weights_BGS_phot=weight_phot

zbins_LRG_phot=0.4,0.6,0.8,1.1
zcol_LRG_phot=Z_PHOT_MEDIAN
weights_LRG_phot=weight_phot

full_lss_path=/global/cfs/projectdirs/desi/survey/catalogs/DA2/LSS/loa-v1/LSScats/
lensing_path=/global/cfs/projectdirs/desi/survey/catalogs/DA2/LSS/loa-v1/LSScats/nonKP/
version=v2
apply_cut_secondary_properties=True
apply_individual_cuts=True
do_full_alpha_stepwise_calculation=True
dkappa = 0.002
dkappa_max = 0.03

fiber_mag_lensing = Tabulated
#alternatives:
#deVaucouleurs_prifle
#Exponential_profile
#Tabulated
#no_correction

; BGS_phot/LRG_phot secondary cuts are hardcoded-skipped in cuts.py --
; no [secondary_properties] section needed, and fit_secondary_quantities.py
; is not a prerequisite for this config.

[individual_cuts]
validate_individual_cuts=False

[output]
output_path=/global/cfs/cdirs/desi/users/schiarenza/magnification_bias_DESI/measurements/
output_filename=DESI_magnification_bias_PHOTO.h5
