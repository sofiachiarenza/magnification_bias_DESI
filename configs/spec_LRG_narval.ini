[general]
galaxy_types=LRG
regions=all,north,south,des,south+des

; Rebinned to the single 0.4-1.1 LRG bin (matches PNG_DR2 config.yaml, decided 2026-07-27)
; -- only this value needs remeasuring, not the old 0.4,0.8,1.1 split.
zbins_LRG=0.4,1.1
weights_LRG=weight_FKP
use_zcmb=True

; Narval-local mirror of the NERSC DA2 LSScats tree. "DA2" must appear in this
; path (magnification_bias_DESI.py branches on it) so the nonKP/ + zcmb-tag
; logic is used. v2/nonKP/LRG_zcmb*_clustering.dat.fits are symlinked from
; PNG_DR2/nersc_data/catalogs_DR2_nonKP/. v2/LRG_full_HPmapcut.dat.fits is
; NOT yet present here -- NERSC was down when this was set up, so the
; photometric-cut columns (FLUX_*, MASKBITS, FIBERFLUX_Z, DELTACHI2, SHAPE_R,
; TSNR2_ELG, ZWARN, MORPHTYPE, EBV, NOBS_*) can't be joined in yet. Fetch it
; from /global/cfs/projectdirs/desi/survey/catalogs/DA2/LSS/loa-v1/LSScats/v2/LRG_full_HPmapcut.dat.fits
; once NERSC/Globus is reachable, and drop it at nersc_data/DA2/v2/LRG_full_HPmapcut.dat.fits.
full_lss_path=nersc_data/DA2/
; fit_secondary_quantities.py reads config['general']['lensing_path'] unconditionally
; (even though it's dead/unused there and in magnification_bias_DESI.py) -- keep it set
; to avoid a configparser NoOptionError, even though nothing actually reads from it.
lensing_path=nersc_data/DA2/v2/nonKP/
version=v2
apply_cut_secondary_properties=True
apply_individual_cuts=True
do_full_alpha_stepwise_calculation=True
dkappa = 0.002
dkappa_max = 0.03

fiber_mag_lensing = Tabulated
#alternatives:
#deVaucouleurs_prifle
#Exponential_profile
#Tabulated
#no_correction

[secondary_properties]
Xval_LRG=FIBERFLUX_Z
relevant_secondary_properties_LRG=DELTACHI2

[individual_cuts]
validate_individual_cuts=False

[output]
output_path=measurements/
output_filename=DESI_magnification_bias_LRG.h5
